<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 助手图标候选</title>
<style>
/* 布局：左侧分组候选网格，右侧吸顶的「真实导航」预览；窄屏时预览在上 */
:root {
  --bg: rgb(245 243 236);
  --surface: rgb(255 253 248);
  --surface-2: rgb(240 237 228);
  --line: rgb(230 226 214);
  --fg: rgb(31 30 27);
  --fg-2: rgb(77 74 66);
  --muted: rgb(111 107 96);
  --subtle: rgb(154 149 136);
  --primary: rgb(193 95 60);
  --primary-soft: rgb(246 231 222);
  --primary-fg: rgb(255 255 255);
  --nav-active-bg: rgb(235 229 216);
  --warn-soft: rgb(250 238 214);
  --warn: rgb(150 98 20);
  --font-display: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: rgb(15 17 21); --surface: rgb(23 26 33); --surface-2: rgb(29 33 42); --line: rgb(38 43 53);
    --fg: rgb(230 232 238); --fg-2: rgb(195 200 211); --muted: rgb(139 147 165); --subtle: rgb(100 108 125);
    --primary: rgb(143 176 255); --primary-soft: rgb(29 42 69); --primary-fg: rgb(15 17 21); --nav-active-bg: rgb(28 36 54);
    --warn-soft: rgb(58 46 22); --warn: rgb(232 190 110);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: rgb(15 17 21); --surface: rgb(23 26 33); --surface-2: rgb(29 33 42); --line: rgb(38 43 53);
  --fg: rgb(230 232 238); --fg-2: rgb(195 200 211); --muted: rgb(139 147 165); --subtle: rgb(100 108 125);
  --primary: rgb(143 176 255); --primary-soft: rgb(29 42 69); --primary-fg: rgb(15 17 21); --nav-active-bg: rgb(28 36 54);
  --warn-soft: rgb(58 46 22); --warn: rgb(232 190 110);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-sans); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 28px 16px 48px; }
header h1 { font-family: var(--font-display); font-size: 26px; font-weight: 700; margin: 0 0 6px; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 62ch; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; margin-top: 24px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } .preview { order: -1; } }

.group + .group { margin-top: 26px; }
.group h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 4px; letter-spacing: .04em; }
.group .hint { font-size: 12.5px; color: var(--subtle); margin: 0 0 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.tile {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 8px 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  color: var(--fg-2); cursor: pointer; font: inherit; text-align: center; transition: border-color .15s, box-shadow .15s;
}
.tile:hover { border-color: var(--subtle); }
.tile:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.tile[aria-pressed="true"] { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); color: var(--primary); }
.tile svg { width: 30px; height: 30px; }
.tile .zh { font-size: 13px; color: var(--fg); }
.tile .en { font-family: var(--font-mono); font-size: 11px; color: var(--subtle); word-break: break-all; }
.tagrow { height: 18px; display: flex; align-items: center; justify-content: center; }
.tag { font-size: 10.5px; line-height: 1; padding: 3px 7px; border-radius: 999px; white-space: nowrap; }
.tag.rec { background: var(--primary-soft); color: var(--primary); }
.tag.now { background: var(--primary); color: var(--primary-fg); }
.tag.old { background: var(--surface-2); color: var(--muted); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }

.preview { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 14px; }
.pv-label { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
.pc-side { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.pc-item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border-radius: 8px; font-size: 13px; color: var(--fg-2); }
.pc-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.pc-item.on { background: var(--nav-active-bg); color: var(--primary); font-weight: 600; }
.pc-mini { display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.pc-mini span { width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--fg-2); }
.pc-mini span.on { background: var(--nav-active-bg); color: var(--primary); }
.pc-mini svg { width: 18px; height: 18px; }
.bnav { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: flex; align-items: flex-end; padding: 8px 4px 8px; position: relative; margin-top: 18px; }
.bnav .t { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
.bnav .t svg { width: 20px; height: 20px; }
.bnav .t.on { color: var(--primary); }
.bnav .c { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
.bnav .c i { width: 46px; height: 46px; margin-top: -26px; border-radius: 999px; background: var(--primary); color: var(--primary-fg); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px var(--bg); }
.bnav .c svg { width: 22px; height: 22px; }
.picked { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
.picked .big { width: 44px; height: 44px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.picked .big svg { width: 24px; height: 24px; }
.picked .txt { min-width: 0; flex: 1; }
.picked .txt b { display: block; font-size: 14px; }
.picked .txt code { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.copy { font: inherit; font-size: 12.5px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg-2); cursor: pointer; white-space: nowrap; }
.copy:hover { border-color: var(--subtle); }
.copy:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.note { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>AI 助手图标候选</h1>
    <p>点任意一个图标，右侧会把它放进真实的 PC 侧边栏和手机底栏里，跟「工作台 / Agent / 消息」摆在一起看。选好后把英文名告诉 Claude 就能换上。图标都来自项目在用的 lucide 图标库。</p>
  </header>

  <div class="layout">
    <main id="groups"></main>

    <aside class="preview" aria-live="polite">
      <div class="picked">
        <span class="big" id="pk-icon"></span>
        <span class="txt"><b id="pk-zh"></b><code id="pk-en"></code></span>
        <button class="copy" id="copy" type="button">复制名称</button>
      </div>
      <div>
        <p class="pv-label">PC 侧边栏（展开 / 收起）</p>
        <div class="pc-side" id="pc-side"></div>
      </div>
      <div>
        <p class="pv-label">手机底栏</p>
        <div class="bnav" id="bnav"></div>
      </div>
      <p class="note">标「与消息相似」「与 Agent 相似」的图标，放进导航里容易和旁边的入口看混，建议慎选。</p>
    </aside>
  </div>
</div>

const GROUPS = [
  { title: '智能 / 大脑', hint: '直接表达「AI」，和机器人、气泡都不冲突', items: [
    ['brain-circuit', 'BrainCircuit', '大脑电路', 'now'], ['brain', 'Brain', '大脑', 'rec'], ['brain-cog', 'BrainCog', '大脑齿轮'],
    ['cpu', 'Cpu', '芯片'], ['atom', 'Atom', '原子'], ['orbit', 'Orbit', '轨道'] ] },
  { title: '对话 / 助手', hint: '强调「能聊天、能问」，但大多是气泡，容易和「消息」撞', items: [
    ['bot-message-square', 'BotMessageSquare', '机器人对话', 'agent'], ['message-square-text', 'MessageSquareText', '文字气泡', 'msg'],
    ['messages-square', 'MessagesSquare', '多条对话', 'msg'], ['message-square-more', 'MessageSquareMore', '气泡省略号', 'msg'],
    ['message-circle-question-mark', 'MessageCircleQuestionMark', '提问气泡', 'msg'], ['speech', 'Speech', '说话'],
    ['audio-lines', 'AudioLines', '语音波形'], ['headset', 'Headset', '耳麦客服', 'rec'] ] },
  { title: '灵感 / 魔法', hint: '常见的「AI 生成」意象；项目里 AI 生成按钮已经在用星星', items: [
    ['sparkles', 'Sparkles', '闪光星星', 'old'], ['sparkle', 'Sparkle', '单颗星'], ['wand-sparkles', 'WandSparkles', '魔法棒', 'rec'],
    ['lightbulb', 'Lightbulb', '灯泡', 'rec'], ['zap', 'Zap', '闪电'] ] },
  { title: '问答 / 帮助 / 分析', hint: '偏「有问题就问它」或「帮你查数据」', items: [
    ['circle-question-mark', 'CircleQuestionMark', '问号'], ['life-buoy', 'LifeBuoy', '救生圈'], ['hand-helping', 'HandHelping', '帮助之手'],
    ['book-open-text', 'BookOpenText', '知识手册'], ['graduation-cap', 'GraduationCap', '学士帽'], ['scan-search', 'ScanSearch', '扫描搜索'],
    ['telescope', 'Telescope', '望远镜'], ['compass', 'Compass', '指南针'], ['chart-spline', 'ChartSpline', '数据曲线'] ] },
]
const TAGS = { now: ['now', '当前在用'], rec: ['rec', '推荐'], old: ['old', '原来的'], msg: ['warn', '与消息相似'], agent: ['warn', '与 Agent 相似'] }

function svg(name) {
  const body = (ICONS[name] || []).map(([tag, attrs]) =>
    '<' + tag + ' ' + Object.entries(attrs).map(([k, v]) => k + '="' + v + '"').join(' ') + '/>').join('')
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>'
}

const all = GROUPS.flatMap((g) => g.items)
let current = 'brain-circuit'
try { const v = localStorage.getItem('ai-icon-pick'); if (v && ICONS[v]) current = v } catch (e) {}

const groupsEl = document.getElementById('groups')
groupsEl.innerHTML = GROUPS.map((g) => '<section class="group"><h2>' + g.title + '</h2><p class="hint">' + g.hint + '</p><div class="grid">' +
  g.items.map(([id, en, zh, tag]) => '<button type="button" class="tile" id="tile-' + id + '" data-id="' + id + '" aria-pressed="false">' +
    '<span class="tagrow">' + (tag ? '<span class="tag ' + TAGS[tag][0] + '">' + TAGS[tag][1] + '</span>' : '') + '</span>' +
    svg(id) + '<span class="zh">' + zh + '</span><span class="en">' + en + '</span></button>').join('') +
  '</div></section>').join('')

function render() {
  const item = all.find((x) => x[0] === current)
  document.querySelectorAll('.tile').forEach((t) => t.setAttribute('aria-pressed', String(t.dataset.id === current)))
  document.getElementById('pk-icon').innerHTML = svg(current)
  document.getElementById('pk-zh').textContent = item[2]
  document.getElementById('pk-en').textContent = item[1]
  const nav = [['house', '工作台'], ['bot', 'Agent'], [current, 'AI 助手', true], ['message-circle', '消息']]
  document.getElementById('pc-side').innerHTML =
    nav.map(([i, l, on]) => '<div class="pc-item' + (on ? ' on' : '') + '">' + svg(i) + '<span>' + l + '</span></div>').join('') +
    '<div class="pc-mini">' + nav.map(([i, l, on]) => '<span class="' + (on ? 'on' : '') + '" title="' + l + '">' + svg(i) + '</span>').join('') + '</div>'
  const tab = (i, l, on) => '<div class="t' + (on ? ' on' : '') + '">' + svg(i) + '<span>' + l + '</span></div>'
  document.getElementById('bnav').innerHTML = tab('house', '工作台') + tab(current, 'AI 助手', true) +
    '<div class="c"><i>' + svg('bot') + '</i><span>Agent</span></div>' + tab('message-circle', '消息') + tab('settings', '设置')
}

groupsEl.addEventListener('click', (e) => {
  const t = e.target.closest('.tile'); if (!t) return
  current = t.dataset.id
  try { localStorage.setItem('ai-icon-pick', current) } catch (err) {}
  render()
})
document.getElementById('copy').addEventListener('click', async (e) => {
  const btn = e.currentTarget, name = document.getElementById('pk-en').textContent
  try { await navigator.clipboard.writeText(name); btn.textContent = '已复制' }
  catch (err) { const r = document.createRange(); r.selectNodeContents(document.getElementById('pk-en')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = '已选中，按 Ctrl+C' }
  setTimeout(() => { btn.textContent = '复制名称' }, 1600)
})
render()
</script>
